version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5

  - package-ecosystem: nuget
    directory: /CopyGIF
    schedule:
      interval: monthly
      time: "10:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
